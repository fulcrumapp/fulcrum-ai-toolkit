<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Species picker</title>
  <!-- Source: https://docs.fulcrumapp.com/docs/app-extensions-introduction -->
  <!-- Document: a complete standalone extension page. Upload it as the Reference File named species-picker.html so attachment://species-picker.html resolves. -->
  <!-- Required Fulcrum extension bootstrap; keep intact for offline use. -->
  <script type="text/javascript">
    (() => {
      const searchParams = new URLSearchParams(window.location.search);

      function parseJson(data) {
        try {
          return JSON.parse(data);
        } catch {
          return null;
        }
      }

      window.Fulcrum={
        isExtension: searchParams.get('extension') === '1',

        initialize() {
          const params = window.Fulcrum.params;
          window.Fulcrum.id = params?.id;
          window.Fulcrum.url = params?.url;
          window.Fulcrum.data = params?.data;
          window.Fulcrum.origin = params?.origin;

          if (typeof window.Fulcrum.onLoadOnce === 'function') {
            window.Fulcrum.onLoadOnce();
          }
        },

        load(callback) {
          window.Fulcrum.onLoadOnce = () => {
            if (window.Fulcrum.params && !window.Fulcrum.isLoaded) {
              window.Fulcrum.isLoaded = true;
              callback({ data: window.Fulcrum.data });
            }
          };
          window.Fulcrum.onLoadOnce();
        },

        send(payload = {}, { close = false } = {}) {
          const message = {
            id: window.Fulcrum.id,
            url: window.Fulcrum.url,
            data: payload,
            close
          };

          if (window.webkit?.messageHandlers?.extensionListener) {
            window.webkit.messageHandlers.extensionListener.postMessage(
              JSON.stringify(message)
            );
          } else if (window.parent) {
            window.parent.postMessage({ extensionMessage: message }, window.Fulcrum.origin);
          }
        },

        receive(event) {
          if (
            event.origin &&
            !event.origin.endsWith('fulcrumapp.com') &&
            event.origin !== window.location.origin &&
            event.origin !== 'null'
          ) {
            return;
          }

          const parsed = parseJson(event.data);
          if (parsed && parsed.command === 'initialize' && !window.Fulcrum.params) {
            window.Fulcrum.params = parsed.params;
            window.Fulcrum.initialize();
          }
        },

        finish(payload) {
          window.Fulcrum.send(payload, { close: true });
        }
      };

      if (window.Fulcrum.isExtension) {
        window.addEventListener('message', window.Fulcrum.receive, false);
      } else {
        window.addEventListener('DOMContentLoaded', window.Fulcrum.initialize);
      }
    })();
  </script>
  <style>
    /* Keep styles self-contained — no external stylesheets at runtime. */
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --color-bg: #ffffff;
      --color-text: #212529;
      --color-border: #ced4da;
      --color-primary: #0066cc;
      --color-primary-hover: #0052a3;
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      margin: 0;
      padding: 16px;
      color: var(--color-text);
      background-color: var(--color-bg);
      line-height: 1.5;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background-color: #fff;
    }

    select:focus {
      outline: 2px solid var(--color-primary);
      outline-offset: 1px;
    }

    button {
      align-self: flex-start;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background-color: var(--color-primary);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
    }

    button:hover,
    button:focus {
      background-color: var(--color-primary-hover);
    }
  </style>
</head>
<body>
  <main class="container">
    <label for="my-select">Tree Species</label>
    <select id="my-select">
      <option value="">-- Choose a species --</option>
      <option value="quercus_alba">Quercus alba (White Oak)</option>
      <option value="acer_saccharum">Acer saccharum (Sugar Maple)</option>
      <option value="pinus_strobus">Pinus strobus (Eastern White Pine)</option>
      <option value="cornus_florida">Cornus florida (Flowering Dogwood)</option>
    </select>
    <button id="save-btn" type="button">Save Selection</button>
  </main>
  <script type="text/javascript">
    const select = document.getElementById('my-select');
    const saveBtn = document.getElementById('save-btn');

    Fulcrum.load((payload) => {
      initialize(payload.data || {});
    });

    function initialize(data) {
      select.value = data.current_value || '';
    }

    saveBtn.addEventListener('click', () => {
      const selectedValue = select.value;
      Fulcrum.finish({ value: selectedValue });
    });
  </script>
</body>
</html>
