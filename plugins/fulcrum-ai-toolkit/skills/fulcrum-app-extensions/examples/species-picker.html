<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Species picker</title>
  <!-- Source: https://docs.fulcrumapp.com/docs/app-extensions-introduction -->
  <!-- Document: a complete standalone extension page. Upload it as the Reference File named species-picker.html so attachment://species-picker.html resolves. -->
  <!-- Required Fulcrum extension bootstrap; keep intact for offline use. -->
  <script>
    (() => {
      const searchParams = new URLSearchParams(window.location.search);

      function parseJson(data) {
        try {
          return JSON.parse(data);
        } catch {
          return null;
        }
      }

      window.Fulcrum={
        isExtension: searchParams.get('extension') === '1',

        initialize() {
          const params = window.Fulcrum.params;
          window.Fulcrum.id = params?.id;
          window.Fulcrum.url = params?.url;
          window.Fulcrum.data = params?.data;
          window.Fulcrum.origin = params?.origin;

          if (typeof window.Fulcrum.onLoadOnce === 'function') {
            window.Fulcrum.onLoadOnce();
          }
        },

        load(callback) {
          window.Fulcrum.onLoadOnce = () => {
            if (window.Fulcrum.params && !window.Fulcrum.isLoaded) {
              window.Fulcrum.isLoaded = true;
              callback({ data: window.Fulcrum.data });
            }
          };
          window.Fulcrum.onLoadOnce();
        },

        send(payload = {}, { close = false } = {}) {
          const message = {
            id: window.Fulcrum.id,
            url: window.Fulcrum.url,
            data: payload,
            close
          };

          if (window.webkit?.messageHandlers?.extensionListener) {
            window.webkit.messageHandlers.extensionListener.postMessage(
              JSON.stringify(message)
            );
          } else if (window.parent) {
            window.parent.postMessage({ extensionMessage: message }, window.Fulcrum.origin);
          }
        },

        receive(event) {
          if (
            event.origin &&
            !event.origin.endsWith('fulcrumapp.com') &&
            event.origin !== window.location.origin &&
            event.origin !== 'null'
          ) {
            return;
          }

          const parsed = parseJson(event.data);
          if (parsed && parsed.command === 'initialize' && !window.Fulcrum.params) {
            window.Fulcrum.params = parsed.params;
            window.Fulcrum.initialize();
          }
        },

        finish(payload) {
          window.Fulcrum.send(payload, { close: true });
        }
      };

      if (window.Fulcrum.isExtension) {
        window.addEventListener('message', window.Fulcrum.receive, false);
      } else {
        window.addEventListener('DOMContentLoaded', window.Fulcrum.initialize);
      }
    })();
  </script>
  <style>
    /* Keep styles self-contained — no external stylesheets at runtime. */
    body { font-family: sans-serif; margin: 0; padding: 16px; }
    select, button { font-size: 1rem; padding: 8px; }
  </style>
</head>
<body>
  <label for="my-select">Species</label>
  <select id="my-select">
    <option value="">-- choose --</option>
    <option value="option_a">Option A</option>
    <option value="option_b">Option B</option>
  </select>
  <button id="save-btn" type="button">Save</button>
  <script>
    var select = document.getElementById('my-select');

    Fulcrum.load(function (payload) {
      initialize(payload.data || {});
    });

    function initialize(data) {
      select.value = data.current_value || '';
    }

    document.getElementById('save-btn').addEventListener('click', function () {
      var selectedValue = document.getElementById('my-select').value;
      Fulcrum.finish({ value: selectedValue });
    });
  </script>
</body>
</html>
