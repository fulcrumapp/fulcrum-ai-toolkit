name: Validate toolkit

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: tools/format-validator/package-lock.json
      - name: Install pinned format validator dependencies
        run: npm ci
        working-directory: tools/format-validator
      - name: Validate skills and manifests
        run: ruby scripts/validate.rb
      - name: Check App MCP contract guidance
        run: ruby test/app_mcp_contract_test.rb
      - name: Check host manifest contracts
        run: ruby test/manifest_contract_test.rb
      - name: Check product knowledge decomposition
        run: ruby test/product_knowledge_decomposition_test.rb
      - name: Check externalized examples and assets
        env:
          REQUIRE_NODE: "1"
        run: ruby test/external_examples_test.rb
      - name: Run smoke test
        run: ruby test/smoke_test.rb
