name: Validate toolkit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: tools/format-validator/package-lock.json
      - name: Install pinned format validator dependencies
        run: npm ci
        working-directory: tools/format-validator
      - name: Run format and schema validator
        run: npm run validate
        working-directory: tools/format-validator
      - name: Validate skills and manifests
        run: node scripts/validate.mjs
      - name: Validate app scoring, review guidance, bundle, and frontmatter/package contracts
        run: node --test test/app-scorecard.test.mjs test/app-approval.test.mjs test/agent-plugin-manifest.test.mjs test/agent-mcp-config.test.mjs test/agent-skill-frontmatter.test.mjs test/package-invariants.test.mjs test/build-m365-bundle.test.mjs test/validate-entrypoint-frontmatter.test.mjs
      - name: Build Microsoft 365 Copilot bundle
        run: node scripts/build-m365-bundle.mjs
      - name: Upload Microsoft 365 Copilot bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: fulcrum-ai-toolkit-m365
          path: fulcrum-ai-toolkit-m365.zip
          if-no-files-found: error
      - name: Validate Anthropic Claude plugin marketplace
        uses: anthropics/claude-plugins-community/.github/actions/validate-plugins@a727be1c7bd6064419b6f60d71993a19198adc17
        with:
          marketplace-path: .claude-plugin/marketplace.json
