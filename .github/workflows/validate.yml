name: Validate toolkit

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Validate skills and manifests
        run: ruby scripts/validate.rb
      - name: Run smoke test
        run: ruby test/smoke_test.rb
