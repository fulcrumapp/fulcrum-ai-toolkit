name: Publish toolkit release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolkit-release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/build-m365-bundle.mjs
          if [[ ! -f fulcrum-ai-toolkit-m365.zip ]]; then
            echo "::error::Missing fulcrum-ai-toolkit-m365.zip"
            exit 1
          fi

          version="$(node --print "require('./plugins/fulcrum-ai-toolkit/plugin.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid toolkit version: $version"
            exit 1
          fi

          tag="v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            fulcrum-ai-toolkit-m365.zip
