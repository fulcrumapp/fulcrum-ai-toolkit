name: Publish toolkit release

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolkit-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'pull_request_target' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')) }}
    runs-on: flcrm-gh-code
    permissions:
      contents: read
    env:
      TOOLKIT_RELEASE_ROLLOUT_PR: ${{ vars.TOOLKIT_RELEASE_ROLLOUT_PR }}
    steps:
      - name: Check release automation configuration
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.TOOLKIT_RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.TOOLKIT_RELEASE_APP_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_APP_CLIENT_ID" || { echo "::error::Configure TOOLKIT_RELEASE_APP_CLIENT_ID"; exit 1; }
          test -n "$RELEASE_APP_PRIVATE_KEY" || { echo "::error::Configure TOOLKIT_RELEASE_APP_PRIVATE_KEY"; exit 1; }
          test -n "$TOOLKIT_RELEASE_ROLLOUT_PR" || { echo "::error::Configure TOOLKIT_RELEASE_ROLLOUT_PR"; exit 1; }
      - name: Create release automation token
        id: release-app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          client-id: ${{ vars.TOOLKIT_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TOOLKIT_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-merge-queues: write
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.release-app.outputs.token }}
      - name: Set up Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.22.0
      - name: Reconcile release pull requests and publication
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          TOOLKIT_RELEASE_BOT_LOGIN: ${{ format('{0}[bot]', steps.release-app.outputs.app-slug) }}
        run: |
          set -euo pipefail
          command -v git >/dev/null || { echo "::error::Missing required tool: git"; exit 1; }
          command -v gh >/dev/null || { echo "::error::Missing required tool: gh"; exit 1; }
          command -v zip >/dev/null || { echo "::error::Missing required tool: zip"; exit 1; }
          node scripts/release-toolkit.mjs
